name: Core guard

# Fails a PR that touches a core path (.github/core-paths.txt) until the
# core-change-approved label is applied, and names the core files it touched.
# Issue #28, CLAUDE.md Hard rule 1.
#
# pull_request_target, not pull_request: the workflow and the script always
# come from the DEFAULT branch (main), whatever the PR targets, so a PR cannot
# run or change its own guard. A PR into another branch is still checked
# against main's guard and path list. SECURITY:
# never check out, install or run PR code in this workflow. The changed-file
# list comes from the GitHub API only.
#
# Separate from ci.yml so adding or removing a label re-runs only this check,
# not E2E. No branch or path filter: it always reports, so it can be a
# required check without blocking PRs that don't touch core.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read        # check out main (the guard's own files)
  pull-requests: read   # list the PR's changed files

concurrency:
  group: core-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  core-guard:
    name: Core guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (never the PR head)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check core paths
        run: node scripts/core-guard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
