name: Claude Code Review

# Never on drafts; once when marked Ready for review, then again on every push (#53).
# A draft push still creates a run, with the job shown as Skipped.
on:
  pull_request:
    types: [ready_for_review, synchronize]

# A newer push cancels a review still running for an older commit.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # --comment is required: without it the plugin prints to the job log only
          # Full URL: `gh pr view` only accepts a number, an https URL, or a branch name
          # The plugin's step 1 stops if Claude already commented on the PR, which would skip every
          # push after Ready (#53). Override only that condition.
          prompt: |
            /code-review:code-review --comment https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            This workflow runs only when the PR is marked ready or receives new commits, so a new review is
            always wanted: ignore the step-1 condition "Claude has already commented on this PR". Apply the
            other step-1 conditions as written.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
